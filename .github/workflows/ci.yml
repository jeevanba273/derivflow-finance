name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "ruff==0.17.3"
      - run: ruff check .
      - run: ruff format --check .
      - name: ASCII punctuation and no emoji in shipped text
        run: |
          # Fail on emoji, dingbats, typographic dashes, curly quotes and the ellipsis
          # character in sources, README, CHANGELOG and docs.
          if grep -rlP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{2013}\x{2014}\x{2018}\x{2019}\x{201C}\x{201D}\x{2026}]' \
              src README.md CHANGELOG.md docs --include='*.py' --include='*.md' --include='*.rst'; then
            echo "Non-ASCII punctuation or emoji found in the files above."
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with the reference libraries (QuantLib, py_vollib)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the test suite (cross-checks included, network tests skipped)
        run: pytest --cov=derivflow_finance --cov-report=term-missing -p no:cacheprovider
      - name: Benchmark script smoke run
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python benchmarks/run_benchmarks.py --quick --reps 1 > /dev/null

  minimum-versions:
    name: Tests with the oldest supported numpy and scipy (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.23.5" "scipy==1.9.3" pytest
          pip install -e . --no-deps
      - name: Core tests without optional dependencies
        run: pytest -p no:cacheprovider

  docs:
    name: Documentation build (warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
