name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version matches tag
        run: |
          python -m pip install dist/*.whl
          built=$(python -c "import derivflow_finance; print(derivflow_finance.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "built version: $built, tag: $tag"
          if [ "$built" != "$tag" ]; then
            echo "Version in pyproject.toml ($built) does not match tag ($tag)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no API token stored as a secret.
    environment:
      name: pypi
      url: https://pypi.org/p/derivflow-finance
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
