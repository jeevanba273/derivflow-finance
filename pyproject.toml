[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "derivflow-finance"
version = "0.3.1"
description = "Option pricing, Greeks, implied volatility, barrier and Asian options, Heston and portfolio VaR, cross-checked against QuantLib"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeevan B A", email = "jeevanba273@gmail.com" }]
maintainers = [{ name = "Jeevan B A", email = "jeevanba273@gmail.com" }]
keywords = [
    "options",
    "derivatives",
    "black-scholes",
    "greeks",
    "implied-volatility",
    "binomial-tree",
    "monte-carlo",
    "barrier-options",
    "asian-options",
    "heston",
    "value-at-risk",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
# Live market data (Yahoo Finance). The core package never imports it.
data = ["yfinance>=0.2.40", "pandas>=1.5", "tzdata"]
# Plotly dashboards and the matplotlib surface plot.
plot = ["plotly>=5.0", "matplotlib>=3.5", "pandas>=1.5"]
# Independent reference libraries used by the cross-check tests and benchmarks
# (psutil records the background load during benchmark runs).
validation = ["QuantLib>=1.30", "py_vollib>=1.0.1", "psutil>=5.9"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]
dev = [
    "derivflow-finance[data,plot,test,validation]",
    "ruff>=0.17,<0.18",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/jeevanba273/derivflow-finance"
Documentation = "https://derivflow-finance.readthedocs.io"
Source = "https://github.com/jeevanba273/derivflow-finance"
Issues = "https://github.com/jeevanba273/derivflow-finance/issues"
Changelog = "https://github.com/jeevanba273/derivflow-finance/blob/main/CHANGELOG.md"
Blog = "https://financefluentblog.com/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
derivflow_finance = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: Monte Carlo and Heston statistical tests that take a few seconds",
    "network: tests that need internet access (skipped unless --run-network is given)",
]

[tool.coverage.run]
source = ["derivflow_finance"]
branch = true
omit = ["*/visualization/*", "*/utils/market_data.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks", "examples"]
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = [
    "RUF002", # Greek letters in docstrings are intentional (math notation)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.format]
quote-style = "double"
